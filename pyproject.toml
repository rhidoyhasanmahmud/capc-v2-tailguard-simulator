[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capc-v2-tailguard-sim"
version = "0.2.0"
description = "Research simulator for CAPC-v2 TailGuard with frozen CAPC-v1 semantic-equivalence baselines."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Hasan Mahmud Rhidoy"}]
dependencies = [
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
  "pandas>=2.0,<4",
  "scipy>=1.12,<2",
  "statsmodels>=0.14,<1",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
